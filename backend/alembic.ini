# Задаёт папку изменений схемы и журнал их выполнения.
# Рабочий адрес базы передаёт файл запуска обновлений.

# Папка изменений схемы считается от места этого файла
[alembic]
script_location = %(here)s/database/migrations

# Ищем код приложения в рабочей папке
prepend_sys_path = .

# Разделитель путей берём из операционной системы
path_separator = os

# Действующий адрес базы берём из настроек запуска
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

# Настройки журнала при обновлении схемы
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
