# Описывает зависимости, состав пакета и правила проверок исходников.
# Единые параметры позволяют запускать проверки одинаково дома и на площадке сборки.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kandinsky-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.40,<3",
 "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "pwdlib[argon2]>=0.2,<1",
 "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pillow>=13,<14",
 "alembic>=1.15,<2", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3", "hypothesis>=6,<7"]
[tool.setuptools.packages.find]
where = ["."]
include = [
    "app", "app.*", "bootstrap", "config", "routes",
    "database", "database.seeders", "database.seeders.sample_media",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "D300", "D419", "RUF100"]
ignore = ["E501", "B008"]

[tool.setuptools.package-data]
"database.seeders.sample_media" = ["*.gz", "archive.sha256"]
"app.Services.Accounts" = ["common_passwords.sha256"]
"app.Services.Gpu.Runner" = ["requirements.txt", "source.lock", "setup.sh"]
